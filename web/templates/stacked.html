{% extends 'base.html' %}

{% block title %}Stacked Data for {{source_id}}{% endblock %}

{% block content %}

<div id="stacked_container" style="position: absolute; width: 100%; height: 100vh; background-color: rgba(0,0,0,1);">
    {% if not stack_file_exists %}
    <h3 style="color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.75;">No stacked data available</h3>
    {% else %}
    <i style="position: fixed; width: 100%; text-align: center; bottom: 1vh; color: white; opacity: 0.4; font-weight: 200; font-size: 0.9em;">(Click here or use 'f' and 't' keys to switch axis between time and frequency)</i>
    <div id="stacked_data" style="width: 90%; height: 90%; margin-left: 5%;  margin-top: 3%; "></div>
    {% endif %}
</div>
<script>
    function showErrorMessage(message) {
        alert(message);
    }

    const arange = (start, stop, step = 1) => {
        // Calculate how many steps are needed
        const length = Math.max(Math.ceil((stop - start) / step), 0);

        // Generate the array based on index
        return Array.from({ length }, (_, i) => start + i * step);
    };

    function plotData(axis) {
        var stack_data_url = "{{ url_for('dealias_stacked_data', source_id=source_id) }}?axis=" + axis;

        $.getJSON(stack_data_url, function(data) {
            console.log("Stack data loaded. ");

            // Set url for stacked data based on axis
            history.pushState(null, "", "?axis=" + axis);

            // Check if data available (having key "not_available")
            if ("not_available" in data) {
                console.log("Stack data not available.");
                return;
            } 

            // Get data
            var stacked_data = data["data"];
            var metadata = data["metadata"];
            console.log("Metadata: ", metadata);

            // Get number of days stacked
            var n_days = metadata["durations"].length;

            // Determine title and axis
            var title = "Stacked Data<br>{{source_id}} | " + n_days + " days | " + Math.round(metadata["durations"][0] * 86400 / 60 * 1000) / 1000 + " min per day";
            var xaxis = { title: "Pulse Phase", mirror: true, showline: true, ticks: 'outside', tickcolor: '#ffffff', gridcolor: '#eeeeee', linecolor: '#ffffff' };
            var yaxis = { title: "", mirror: true, showline: true, ticks: 'outside', tickcolor: '#ffffff', gridcolor: '#eeeeee', linecolor: '#ffffff' };
            if (axis === "time") {
                yaxis["title"] = "Sub-integration";
                var n_subints = stacked_data.length;
                var plotdata = [{
                    x: arange(0, 1, 1 / stacked_data[0].length), 
                    y: arange(0, n_subints, 1), 
                    z: stacked_data,
                    type: 'heatmap',
                    colorscale: 'YlOrRd', 
                    showscale: false
                }];
                console.log("Plot data: ", plotdata);
            } else if (axis === "freq") {
                yaxis["title"] = "Frequency (MHz)";

                var freq_hi = metadata["freq_hi"][0];
                var freq_lo = metadata["freq_lo"][0];
                var n_chan = stacked_data.length;

                var plotdata = [{
                    x: arange(0, 1, 1 / stacked_data[0].length), 
                    y: arange(freq_lo, freq_hi, (freq_hi - freq_lo) / n_chan), 
                    z: stacked_data,
                    type: 'heatmap',
                    colorscale: 'YlOrRd', 
                    showscale: false
                }]
                console.log("Plot data: ", plotdata);
            }

            // Plot
            Plotly.newPlot('stacked_data', plotdata, {
                title: title,
                xaxis: xaxis,
                yaxis: yaxis, 
                plot_bgcolor: 'rgba(0,0,0,0)',
                paper_bgcolor: 'rgba(0,0,0,0)',
                font: {
                    color: '#ffffff'
                }
            });
        });
    }

    $(document).ready(function() {
        const urlParams = new URLSearchParams(window.location.search);
        let axis = urlParams.get('axis');

        if (!axis || (axis !== "time" && axis !== "freq")) {
            axis = "time";
        }

        plotData(axis);

        // Click blank area to switch axis between time and frequency
        $("#stacked_container").on("click", function() {
            if (axis === "time") {
                axis = "freq";
            } else {
                axis = "time";
            }
            plotData(axis);
        });
        $("#stacked_data").on("click", function(event) {
            event.stopPropagation();
        });

        // Use f and t keyboard shortcuts to switch axis
        $(document).on("keydown", function(event) {
            if (event.key === "f") {
                axis = "freq";
                plotData(axis);
            } else if (event.key === "t") {
                axis = "time";
                plotData(axis);
            }
        });
    });
</script>

{% endblock %}
